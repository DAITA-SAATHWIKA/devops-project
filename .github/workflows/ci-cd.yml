name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-app:latest ./app

      - name: Run Docker container
        run: docker run -d -p 5000:5000 --name test-container devops-app:latest

      - name: Test application
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000; then
              exit 0
            fi
            sleep 2
          done
          echo "Application failed to respond"
          docker logs test-container
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker stop test-container || true