name: DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t devops-app:latest ./app

      - name: Deploy Container
        run: |
          docker rm -f devops-container || true
          docker run -d --restart unless-stopped -p 5000:5000 --name devops-container devops-app:latest

      - name: Verify Deployment
        run: |
          for i in {1..10}; do
            if curl --fail http://localhost:5000; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-container
          exit 1
